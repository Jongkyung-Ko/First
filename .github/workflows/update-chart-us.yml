name: Update Chart US Snapshot

# 차트 US — 단기 스케줄(update-recommend2) 20:45 ET 슬롯에서 실행. 수동 재실행용.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-chart-us
  cancel-in-progress: true

jobs:
  build-on-render:
    runs-on: ubuntu-latest
    steps:
      - name: Build US chart snapshot on Render API
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "STOCK_API_URL or CRON_SECRET not set — cannot build chart snapshot."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE%/}/api/chart/cron/build?region=us"
