name: Update Chart US Snapshot

on:
  schedule:
    # ET 18:00 EDT (22:00 UTC)
    - cron: "0 22 * * *"
    # ET 18:00 EST (23:00 UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-chart-us
  cancel-in-progress: true

jobs:
  build-on-render:
    runs-on: ubuntu-latest
    steps:
      - name: Build US chart snapshot on Render API
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "STOCK_API_URL or CRON_SECRET not set — cannot build chart snapshot."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE%/}/api/chart/cron/build?region=us"
