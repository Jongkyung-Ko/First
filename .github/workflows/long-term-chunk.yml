name: Long-term screens chunk

on:
  schedule:
    # Every 6 hours (UTC) — off-peak stagger vs 18:00 Stock Picks cron
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      chunk_count:
        description: "연속 청크 횟수 (1회=시장 일부, 20~30이면 소형·저PBR 1시장 완료 근처)"
        required: false
        default: "1"
        type: string

concurrency:
  group: long-term-chunk
  cancel-in-progress: false

jobs:
  run-chunk:
    runs-on: ubuntu-latest
    steps:
      - name: Run long-term chunk(s) on Render API
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHUNK_COUNT: ${{ github.event.inputs.chunk_count || '1' }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Skipping (missing STOCK_API_URL or CRON_SECRET)."
            exit 0
          fi
          COUNT="${CHUNK_COUNT:-1}"
          case "${COUNT}" in
            ''|*[!0-9]*) COUNT=1 ;;
          esac
          if [ "${COUNT}" -gt 60 ]; then COUNT=60; fi
          echo "Running ${COUNT} long-term chunk(s)..."
          i=1
          while [ "${i}" -le "${COUNT}" ]; do
            echo "--- chunk ${i}/${COUNT} ---"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time 600 \
              "${API_BASE%/}/api/long-term/cron/chunk" || exit 1
            echo ""
            if [ "${i}" -lt "${COUNT}" ]; then sleep 3; fi
            i=$((i + 1))
          done
          echo "Long-term chunk batch completed (${COUNT} run(s))."
