name: Long-term screens chunk

on:
  schedule:
    # Every 6 hours (UTC) — off-peak stagger vs 18:00 Stock Picks cron
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      chunk_count:
        description: "연속 청크 횟수 (0=trim만, 1=기본)"
        required: false
        default: "1"
        type: string
      trim_picks:
        description: "추천 TOP 2로 자르고 누적 이력 전부 삭제"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: long-term-chunk
  cancel-in-progress: false

jobs:
  run-chunk:
    runs-on: ubuntu-latest
    steps:
      - name: Trim picks to TOP 2 and clear history
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.trim_picks == 'true'
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Skipping trim (missing secrets)."
            exit 0
          fi
          BASE="${API_BASE%/}"
          AUTH="Authorization: Bearer ${CRON_SECRET}"
          try_trim() {
            local url="$1"
            local label="$2"
            echo "--- ${label}: ${url} ---"
            code=$(curl -sS -o /tmp/lt_trim.json -w "%{http_code}" -X POST \
              -H "${AUTH}" --max-time 120 "${url}" || echo "000")
            cat /tmp/lt_trim.json || true
            echo ""
            echo "HTTP ${code}"
            [ "${code}" = "200" ] || [ "${code}" = "201" ]
          }
          if try_trim "${BASE}/api/long-term/cron/chunk?trim_first=true&skip_chunk=true" "chunk+trim"; then
            echo "Trim + history clear completed."
          elif try_trim "${BASE}/api/long-term/cron/trim-picks" "trim-picks"; then
            echo "Trim + history clear completed."
          else
            echo "::warning::Trim API unavailable (404). Render backend 배포(v101+) 후 다시 Run workflow 하세요."
          fi

      - name: Run long-term chunk(s) on Render API
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CHUNK_COUNT: ${{ github.event.inputs.chunk_count || '1' }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Skipping (missing STOCK_API_URL or CRON_SECRET)."
            exit 0
          fi
          COUNT="${CHUNK_COUNT:-1}"
          case "${COUNT}" in
            ''|*[!0-9]*) COUNT=1 ;;
          esac
          if [ "${COUNT}" -gt 60 ]; then COUNT=60; fi
          if [ "${COUNT}" -eq 0 ]; then
            echo "chunk_count=0 — trim only, skipping chunks."
            exit 0
          fi
          echo "Running ${COUNT} long-term chunk(s)..."
          i=1
          while [ "${i}" -le "${COUNT}" ]; do
            echo "--- chunk ${i}/${COUNT} ---"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time 600 \
              "${API_BASE%/}/api/long-term/cron/chunk" || exit 1
            echo ""
            if [ "${i}" -lt "${COUNT}" ]; then sleep 3; fi
            i=$((i + 1))
          done
          echo "Long-term chunk batch completed (${COUNT} run(s))."
