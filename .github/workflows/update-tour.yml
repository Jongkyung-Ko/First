name: Tour Daily Refresh

on:
  schedule:
    # KST 16:00 (07:00 UTC)
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/tour_*.py
      - .github/workflows/update-tour.yml

concurrency:
  group: tour-daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Tour places + cache images on server (Unsplash/Pexels/Pixabay → Supabase)
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          API_BASE="${API_BASE:?Missing STOCK_API_URL secret}"
          API_BASE="${API_BASE%/}"
          CRON_SECRET="${CRON_SECRET:?Missing CRON_SECRET secret}"
          curl -fsS --max-time 1200 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_BASE}/api/tour/cron/refresh"
