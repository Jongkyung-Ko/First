name: Deploy GitHub Pages

# GitHub Pages Deployment API 타임아웃 방지:
# chart JSON·assets/audio(~118MB) 제외, gh-pages는 ~8MB 수준만 배포.
# Settings → Pages → Branch: gh-pages / (root)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build publish directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'backend' \
            --exclude 'scripts' \
            --exclude 'supabase' \
            --exclude 'docs' \
            --exclude '.cursor' \
            --exclude 'assets/audio' \
            --exclude '*.bat' \
            --exclude '*.txt' \
            --exclude '*.csv' \
            --exclude '.tmp-*' \
            --exclude 'data/chart-kr-snapshot.json' \
            --exclude 'data/chart-us-snapshot.json' \
            --exclude 'AGENTS.md' \
            --exclude 'README.md' \
            --exclude 'render.yaml' \
            --exclude '.gitignore' \
            ./ _site/
          touch _site/.nojekyll
          du -sh _site
          find _site -type f | wc -l

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
