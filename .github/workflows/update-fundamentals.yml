name: Update Fundamentals

on:
  schedule:
    # KST 20:30 (11:30 UTC) — KR 장 마감(15:30) 후 · Recommend2(18:00)과 분리
    - cron: "30 11 * * *"
    # ET 21:30 EDT (01:30 UTC next day)
    - cron: "30 1 * * *"
    # ET 21:30 EST (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "kr | us | all"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: update-fundamentals
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve region
        id: region
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_REGION: ${{ github.event.inputs.region }}
        run: |
          if [ -n "$INPUT_REGION" ]; then
            echo "value=$INPUT_REGION" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "30 11 * * *" ]; then
            echo "value=kr" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "30 1 * * *" ] || [ "$EVENT_SCHEDULE" = "30 2 * * *" ]; then
            echo "value=us" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fundamentals on Render (chunked, 25 tickers per call)
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REGION: ${{ steps.region.outputs.value }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::STOCK_API_URL and CRON_SECRET secrets required."
            exit 1
          fi
          BASE="${API_BASE%/}"
          AUTH="Authorization: Bearer ${CRON_SECRET}"
          CHUNK=25
          MAX_OFFSET=200

          case "${REGION}" in
            kr) MARKETS="kospi kosdaq" ;;
            us) MARKETS="nasdaq nyse" ;;
            all) MARKETS="kospi kosdaq nasdaq nyse" ;;
            *) echo "::error::Unknown region ${REGION}"; exit 1 ;;
          esac

          build_market_chunks() {
            local market="$1"
            local offset=0
            echo "=== market=${market} ==="
            while [ "${offset}" -lt "${MAX_OFFSET}" ]; do
              echo "--- ${market} offset=${offset} limit=${CHUNK} ---"
              code=$(curl -sS -o /tmp/fund_chunk.json -w "%{http_code}" -X POST \
                -H "${AUTH}" --max-time 120 \
                "${BASE}/api/fundamentals/cron/build?market=${market}&offset=${offset}&limit=${CHUNK}" || echo "000")
              cat /tmp/fund_chunk.json || true
              echo ""
              echo "HTTP ${code}"
              if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
                exit 1
              fi
              done_flag=$(python3 -c "import json; print('true' if json.load(open('/tmp/fund_chunk.json')).get('done') else 'false')" 2>/dev/null || echo "false")
              if [ "${done_flag}" = "true" ]; then
                echo "${market} complete."
                return 0
              fi
              next=$(python3 -c "import json; print(json.load(open('/tmp/fund_chunk.json')).get('nextOffset', ${offset}+${CHUNK}))" 2>/dev/null || echo "$((offset + CHUNK))")
              offset="${next}"
              sleep 2
            done
            echo "::warning::${market} reached max offset without done flag"
            curl -fsS -X POST -H "${AUTH}" --max-time 120 \
              "${BASE}/api/fundamentals/cron/build?market=${market}&finalize=true" || exit 1
          }

          for m in ${MARKETS}; do
            build_market_chunks "${m}"
          done

      - name: Download snapshot from Render API
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
        run: |
          mkdir -p data
          curl -fsS --max-time 120 \
            "${API_BASE%/}/api/stock-fundamentals" \
            -o data/stock-fundamentals.json
          python3 -c "import json; json.load(open('data/stock-fundamentals.json'))"
          echo "Saved data/stock-fundamentals.json"

      - name: Commit snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update fundamentals snapshot [skip ci]"
          file_pattern: data/stock-fundamentals.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
