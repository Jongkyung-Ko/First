name: Update Fundamentals

on:
  schedule:
    # KST 20:30 (11:30 UTC) — KR 장 마감(15:30) 후 · Recommend2(18:00)과 분리
    - cron: "30 11 * * *"
    # ET 21:30 EDT (01:30 UTC next day)
    - cron: "30 1 * * *"
    # ET 21:30 EST (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "kr | us | all"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: update-fundamentals
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve region
        id: region
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_REGION: ${{ github.event.inputs.region }}
        run: |
          if [ -n "$INPUT_REGION" ]; then
            echo "value=$INPUT_REGION" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "30 11 * * *" ]; then
            echo "value=kr" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "30 1 * * *" ] || [ "$EVENT_SCHEDULE" = "30 2 * * *" ]; then
            echo "value=us" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fundamentals on Render (OPEN_DART_API_KEY on Render only)
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REGION: ${{ steps.region.outputs.value }}
        run: |
          if [ -z "${API_BASE}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::STOCK_API_URL and CRON_SECRET secrets required."
            exit 1
          fi
          BASE="${API_BASE%/}"
          echo "Render build region=${REGION}"
          code=$(curl -sS -o /tmp/fund_build.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 900 \
            "${BASE}/api/fundamentals/cron/build?region=${REGION}" || echo "000")
          cat /tmp/fund_build.json || true
          echo ""
          echo "HTTP ${code}"
          if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
            exit 1
          fi

      - name: Download snapshot from Render API
        env:
          API_BASE: ${{ secrets.STOCK_API_URL }}
        run: |
          mkdir -p data
          curl -fsS --max-time 120 \
            "${API_BASE%/}/api/stock-fundamentals" \
            -o data/stock-fundamentals.json
          python3 -c "import json; json.load(open('data/stock-fundamentals.json'))"
          echo "Saved data/stock-fundamentals.json"

      - name: Commit snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update fundamentals snapshot [skip ci]"
          file_pattern: data/stock-fundamentals.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
