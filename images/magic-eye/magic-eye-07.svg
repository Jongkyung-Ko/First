<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <filter id="n" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="119" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(348, 35%, 72%)"/>
      <stop offset="100%" stop-color="hsl(28, 30%, 58%)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <rect width="800" height="600" filter="url(#n)" opacity="0.55"/>
  <text x="400" y="300" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="28" fill="rgba(15,23,42,0.35)">Magic Eye 07</text>
</svg>
